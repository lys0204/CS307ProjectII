<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUSTC - 食谱网站</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="top-header">
        <div class="header-container">
            <div class="header-left">
                <div class="logo">🍳 SUSTC</div>
            </div>
            <div class="header-center">
                <div class="search-box">
                    <input type="text" id="global-search" placeholder="搜索食谱..." class="search-input">
                    <button class="search-btn" onclick="globalSearch()">🔍</button>
                </div>
            </div>
            <div class="header-right">
            </div>
        </div>
    </header>

    <!-- 分类导航栏 -->
    <nav class="category-nav">
        <div class="category-container">
            <div class="category-right">
                <a href="#" class="category-tag active" onclick="filterByCategory('', event); return false;">全部</a>
                <a href="#" class="category-tag" onclick="filterByCategory('Breakfast', event); return false;">早餐</a>
                <a href="#" class="category-tag" onclick="filterByCategory('Lunch/Snacks', event); return false;">午餐</a>
                <a href="#" class="category-tag" onclick="filterByCategory('Dessert', event); return false;">甜品</a>
                <a href="#" class="category-tag" onclick="filterByCategory('Beverages', event); return false;">饮品</a>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <div class="content-container">
            <!-- 左侧内容区 -->
            <div class="content-left">
                <!-- 内容区域 -->
                <div class="content-section">
                    <div class="section-header">
                        <h2 class="section-title">推荐食谱</h2>
                    </div>
                    <div id="recipe-grid" class="recipe-grid">
                        <!-- 食谱卡片将通过 JS 动态生成 -->
                    </div>
                    <div id="loading" class="loading" style="display: none;">加载中...</div>
                    <div id="pagination" class="pagination" style="display: none;">
                        <button id="prev-page" onclick="changePage(-1)">上一页</button>
                        <span id="page-info">第 1 页 / 共 1 页</span>
                        <button id="next-page" onclick="changePage(1)">下一页</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 食谱详情模态框 -->
    <div id="recipe-modal" class="modal" style="display: none;">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeRecipeModal()">&times;</span>
            <div id="recipe-detail">
                <!-- 详情内容将通过 JS 动态生成 -->
            </div>
        </div>
    </div>

    <script src="js/app.js?v=2"></script>
</body>
</html>

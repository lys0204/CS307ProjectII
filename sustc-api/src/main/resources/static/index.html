<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUSTC - Recipe Platform</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <header class="top-header">
        <div class="header-container">
            <div class="header-left">
                <div class="logo">🍳 SUSTC</div>
            </div>
            <div class="header-center">
                <div class="search-box">
                    <input type="text" id="global-search" placeholder="Search recipes..." class="search-input">
                    <button class="search-btn" onclick="globalSearch()">🔍</button>
                </div>
            </div>
            <div class="header-right">
            </div>
        </div>
    </header>

    <nav class="category-nav">
        <div class="category-container">
            <div class="category-right">
                <a href="#" class="category-tag active" onclick="filterByCategory('', event); return false;">All</a>
                <a href="#" class="category-tag" onclick="filterByCategory('Breakfast', event); return false;">Breakfast</a>
                <a href="#" class="category-tag" onclick="filterByCategory('Lunch/Snacks', event); return false;">Lunch</a>
                <a href="#" class="category-tag" onclick="filterByCategory('Dessert', event); return false;">Dessert</a>
                <a href="#" class="category-tag" onclick="filterByCategory('Beverages', event); return false;">Beverages</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="content-container">
            <div class="content-left">
                <div class="content-section">
                    <div class="section-header">
                        <h2 class="section-title">Recommended Recipes</h2>
                    </div>
                    <div id="recipe-grid" class="recipe-grid">
                    </div>
                    <div id="loading" class="loading" style="display: none;">Loading...</div>
                    <div id="pagination" class="pagination" style="display: none;">
                        <button id="prev-page" onclick="changePage(-1)">Previous</button>
                        <span id="page-info">Page 1 / 1</span>
                        <button id="next-page" onclick="changePage(1)">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="recipe-modal" class="modal" style="display: none;">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeRecipeModal()">&times;</span>
            <div id="recipe-detail">
            </div>
        </div>
    </div>

    <div id="chat-float-btn" class="chat-float-btn" onclick="toggleChat()">
        🤖
    </div>

    <div id="chat-panel" class="chat-panel" style="display: none;">
        <div class="chat-header">
            <span>AI Cooking Assistant</span>
            <span class="chat-close" onclick="toggleChat()">&times;</span>
        </div>
        <div id="chat-messages" class="chat-messages">
            <div class="chat-msg assistant">Hello! I'm your AI cooking assistant. Tell me what you'd like to eat and I'll find the best recipes for you.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="e.g. Recommend a low-fat high-protein dish..."
                   onkeypress="if(event.key==='Enter') sendChat()">
            <button class="chat-send-btn" onclick="sendChat()">Send</button>
        </div>
    </div>

    <script src="js/app.js?v=3"></script>
</body>
</html>
